name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Install Linux Remotion native bindings
        run: npm install --no-save @rspack/binding-linux-x64-gnu@1.7.11 @remotion/compositor-linux-x64-gnu@4.0.518
      - run: npm run typecheck --workspace @vpf/editor-app
      - run: npm test --workspace @vpf/editor-app
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REMOTION_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Linux Remotion native bindings
        run: npm install --no-save @rspack/binding-linux-x64-gnu@1.7.11 @remotion/compositor-linux-x64-gnu@4.0.518
      - run: npm run check:e2e

  pilot-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Linux Remotion native bindings
        run: npm install --no-save @rspack/binding-linux-x64-gnu@1.7.11 @remotion/compositor-linux-x64-gnu@4.0.518
      - run: npm run check:pilot-readiness
